{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-md p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Process YouTube Video</h2>
        
        <form id="videoForm" class="space-y-6">
            <div>
                <label for="url" class="block text-sm font-medium text-gray-700 mb-2">
                    YouTube URL
                </label>
                <input 
                    type="url" 
                    id="url" 
                    name="url" 
                    required 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-colors"
                    placeholder="https://youtube.com/watch?v=..."
                >
            </div>
            
            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-gradient-to-r from-primary to-secondary text-white py-3 px-6 rounded-lg font-medium hover:from-primary/90 hover:to-secondary/90 transition-all transform hover:scale-[1.02] focus:ring-2 focus:ring-primary focus:ring-offset-2"
            >
                Process Video
            </button>
        </form>
    </div>

    <!-- Progress Bar Container (hidden by default) -->
    <div id="progressContainer" class="hidden mt-6 bg-white rounded-lg shadow-md p-6">
        <h3 class="text-lg font-semibold text-gray-800 mb-4">Downloading...</h3>
        <div class="w-full bg-gray-200 rounded-full h-3 mb-2">
            <div id="progressBar" class="bg-gradient-to-r from-primary to-secondary h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <p id="progressText" class="text-sm text-gray-600">0% - Starting...</p>
        <div id="progressDetails" class="text-xs text-gray-500 mt-1"></div>
    </div>

    <!-- Error Container -->
    <div id="errorContainer" class="hidden mt-6 bg-red-50 border-l-4 border-red-400 p-4 rounded-lg">
        <div class="flex">
            <div class="ml-3">
                <p class="text-sm text-red-700">
                    <strong>Error:</strong> <span id="errorMessage"></span>
                </p>
            </div>
        </div>
    </div>

    <!-- Success Container -->
    <div id="successContainer" class="hidden mt-6">
        <div class="bg-green-50 border-l-4 border-green-400 p-4 rounded-lg">
            <div class="flex">
                <div class="ml-3">
                    <p class="text-sm text-green-700 font-medium">
                        ✅ Successfully processed and transcribed!
                    </p>
                </div>
            </div>
        </div>

        <div class="mt-4 bg-white rounded-lg shadow-md p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Video Information</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="videoInfo">
                <!-- Video info will be populated by JavaScript -->
            </div>
            
            <div class="mt-4 bg-blue-50 p-4 rounded-lg">
                <h4 class="font-medium text-gray-700 mb-1">Files saved</h4>
                <p class="text-gray-900 font-mono text-sm" id="filename"></p>
                <p class="text-gray-600 text-xs mt-1">Audio and transcript saved to mounted volume</p>
            </div>
        </div>

        <!-- Transcript Display -->
        <div class="mt-4 bg-white rounded-lg shadow-md p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Transcript</h3>
            <div id="transcriptContent" class="space-y-3 max-h-96 overflow-y-auto bg-gray-50 p-4 rounded-lg border">
                <p class="text-gray-500 text-sm">Loading transcript...</p>
            </div>
        </div>
    </div>
</div>

<script>
let currentEventSource = null;

document.getElementById('videoForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const submitBtn = document.getElementById('submitBtn');
    const progressContainer = document.getElementById('progressContainer');
    const errorContainer = document.getElementById('errorContainer');
    const successContainer = document.getElementById('successContainer');
    
    // Reset UI
    progressContainer.classList.add('hidden');
    errorContainer.classList.add('hidden');
    successContainer.classList.add('hidden');
    
    // Disable submit button
    submitBtn.disabled = true;
    submitBtn.textContent = 'Processing...';
    
    try {
        // Start download
        const response = await fetch('/process', {
            method: 'POST',
            body: formData
        });
        
        if (!response.ok) {
            throw new Error('Failed to start download');
        }
        
        const { task_id } = await response.json();
        
        // Show progress bar
        progressContainer.classList.remove('hidden');
        
        // Close any existing EventSource
        if (currentEventSource) {
            currentEventSource.close();
        }
        
        // Connect to SSE for progress
        currentEventSource = new EventSource(`/progress/${task_id}`);
        
        currentEventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            const percent = data.percent || 0;
            const phase = data.phase || 'unknown';
            const status = data.status || '';
            
            // Update progress bar
            document.getElementById('progressBar').style.width = `${percent}%`;
            
            // Update text based on phase
            let statusText = `${percent}% - ${status}`;
            if (phase === 'downloading') {
                document.getElementById('progressContainer').querySelector('h3').textContent = 'Downloading Audio...';
            } else if (phase === 'transcribing') {
                document.getElementById('progressContainer').querySelector('h3').textContent = 'Transcribing Audio...';
            }
            
            document.getElementById('progressText').textContent = statusText;
            
            if (phase === 'completed') {
                currentEventSource.close();
                currentEventSource = null;
                
                // Hide progress and show success
                setTimeout(async () => {
                    progressContainer.classList.add('hidden');
                    successContainer.classList.remove('hidden');
                    
                    // Fetch and display results
                    try {
                        const resultResponse = await fetch(`/result/${task_id}`);
                        const result = await resultResponse.json();
                        
                        displayResults(result);
                    } catch (error) {
                        console.error('Error fetching results:', error);
                        document.getElementById('filename').textContent = 'Processing completed (error loading details)';
                    }
                    
                    // Re-enable form
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Process Video';
                }, 500);
            } else if (phase === 'error') {
                currentEventSource.close();
                currentEventSource = null;
                
                progressContainer.classList.add('hidden');
                errorContainer.classList.remove('hidden');
                document.getElementById('errorMessage').textContent = data.error || 'Unknown error occurred';
                
                // Re-enable form
                submitBtn.disabled = false;
                submitBtn.textContent = 'Process Video';
            }
        };
        
        currentEventSource.onerror = function(event) {
            console.error('SSE Error:', event);
            currentEventSource.close();
            currentEventSource = null;
            
            progressContainer.classList.add('hidden');
            errorContainer.classList.remove('hidden');
            document.getElementById('errorMessage').textContent = 'Connection lost during download';
            
            // Re-enable form
            submitBtn.disabled = false;
            submitBtn.textContent = 'Process Video';
        };
        
    } catch (error) {
        console.error('Error:', error);
        errorContainer.classList.remove('hidden');
        
        // Check if it's an API key error
        if (error.message.includes('API key')) {
            document.getElementById('errorMessage').innerHTML = 
                'API key not configured. <a href="/settings" class="text-blue-500 hover:underline">Configure it here</a>';
        } else {
            document.getElementById('errorMessage').textContent = error.message;
        }
        
        // Re-enable form
        submitBtn.disabled = false;
        submitBtn.textContent = 'Process Video';
    }
});

// Function to display results
function displayResults(result) {
    const metadata = result.metadata || {};
    const transcript = result.transcript || {};
    
    // Display video info
    const videoInfo = document.getElementById('videoInfo');
    videoInfo.innerHTML = `
        <div class="bg-gray-50 p-4 rounded-lg">
            <h4 class="font-medium text-gray-700 mb-1">Title</h4>
            <p class="text-gray-900">${metadata.title || 'Unknown'}</p>
        </div>
        <div class="bg-gray-50 p-4 rounded-lg">
            <h4 class="font-medium text-gray-700 mb-1">Uploader</h4>
            <p class="text-gray-900">${metadata.uploader || 'Unknown'}</p>
        </div>
        <div class="bg-gray-50 p-4 rounded-lg">
            <h4 class="font-medium text-gray-700 mb-1">Duration</h4>
            <p class="text-gray-900">${formatDuration(metadata.duration || 0)}</p>
        </div>
        <div class="bg-gray-50 p-4 rounded-lg">
            <h4 class="font-medium text-gray-700 mb-1">Views</h4>
            <p class="text-gray-900">${metadata.view_count ? formatNumber(metadata.view_count) : 'N/A'}</p>
        </div>
    `;
    
    // Display filename
    const audio_file = metadata.audio_file || 'audio file';
    document.getElementById('filename').textContent = audio_file.split('/').pop();
    
    // Display transcript
    displayTranscript(transcript);
}

// Function to format duration
function formatDuration(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs.toString().padStart(2, '0')}`;
}

// Function to format numbers
function formatNumber(num) {
    return num.toLocaleString();
}

// Function to display transcript with timestamps
function displayTranscript(transcriptData) {
    const container = document.getElementById('transcriptContent');
    container.innerHTML = '';
    
    if (!transcriptData || (!transcriptData.words && !transcriptData.text)) {
        container.innerHTML = '<p class="text-gray-500 text-sm">No transcript data available</p>';
        return;
    }
    
    // Format timestamp helper
    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        const ms = Math.floor((seconds % 1) * 1000);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${ms.toString().padStart(3, '0')}`;
    }
    
    // Display word-level transcript if available
    if (transcriptData.words && Array.isArray(transcriptData.words)) {
        let currentSpeaker = null;
        let currentParagraph = null;
        let currentWords = [];
        
        transcriptData.words.forEach((word, index) => {
            const speaker = word.speaker || 'Speaker 1';
            
            // Start new paragraph for new speaker or every ~50 words
            if (speaker !== currentSpeaker || currentWords.length >= 50) {
                if (currentParagraph && currentWords.length > 0) {
                    // Finish current paragraph
                    const wordsSpan = currentParagraph.querySelector('.words');
                    wordsSpan.textContent = currentWords.join(' ');
                }
                
                // Start new paragraph
                currentSpeaker = speaker;
                currentWords = [];
                currentParagraph = document.createElement('div');
                currentParagraph.className = 'mb-3 p-3 bg-white rounded border-l-4 border-blue-200';
                currentParagraph.innerHTML = `
                    <div class="flex items-start gap-2 mb-2">
                        <span class="text-xs text-gray-500 font-mono">[${formatTime(word.start || 0)}]</span>
                        <span class="text-xs font-medium text-blue-600">${speaker}:</span>
                    </div>
                    <span class="words text-sm text-gray-800"></span>
                `;
                container.appendChild(currentParagraph);
            }
            
            currentWords.push(word.text || word.word || '');
            
            // Update timestamp for last word in paragraph
            if (index === transcriptData.words.length - 1) {
                const wordsSpan = currentParagraph.querySelector('.words');
                wordsSpan.textContent = currentWords.join(' ');
            }
        });
    } else if (transcriptData.text) {
        // Fallback to plain text if word-level data not available
        const textDiv = document.createElement('div');
        textDiv.className = 'text-sm text-gray-800 p-3 bg-white rounded border-l-4 border-blue-200';
        textDiv.textContent = transcriptData.text;
        container.appendChild(textDiv);
    } else {
        container.innerHTML = '<p class="text-gray-500 text-sm">Transcript format not recognized</p>';
    }
}

// Clean up on page unload
window.addEventListener('beforeunload', function() {
    if (currentEventSource) {
        currentEventSource.close();
    }
});
</script>
{% endblock %}
