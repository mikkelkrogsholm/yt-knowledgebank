{% extends "base.html" %}
{% set page_title = "Video Not Found" %}

{% block content %}
<div class="bg-white shadow-lg rounded-lg p-8">
    <div class="text-center">
        <div class="mb-6">
            <svg class="mx-auto h-16 w-16 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2zM7 9h0m4 0h0m-4 4h0m4 0h0" />
            </svg>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-4">Video Not Found</h1>
        <p class="text-lg text-gray-600 mb-8">{{ message if message else "The requested video could not be found." }}</p>
        <a href="/" class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            <svg class="mr-2 -ml-1 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path>
            </svg>
            Back to Home
        </a>
    </div>
</div>
{% endblock %}
